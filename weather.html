<!DOCTYPE html>
<html>
<head>
    <title>Weather App - Sharadhi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #282a36;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #bd93f9;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #bd93f9;
            border-radius: 8px;
            background: #44475a;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input::placeholder { color: #6272a4; }
        button {
            padding: 12px 24px;
            background: #bd93f9;
            color: #282a36;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #ff79c6; }
        .weather-card {
            background: #44475a;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #6272a4;
            display: none;
        }
        .weather-card h2 {
            color: #f8f8f2;
            margin-bottom: 10px;
        }
        .temp-box {
            font-size: 56px;
            font-weight: bold;
            color: #50fa7b;
            margin: 15px 0;
        }
        #condition {
            color: #8be9fd;
            font-size: 20px;
            margin-bottom: 25px;
            text-transform: capitalize;
        }
        .details {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #6272a4;
            padding-top: 20px;
        }
        .detail span { font-size: 28px; }
        .detail p { color: #94a3b8; margin-top: 5px; }
        .detail p:last-child { color: #f8f8f2; font-weight: bold; }
        .error { color: #ff5555; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button onclick="getWeather()">Search</button>
        </div>
        <div id="weatherResult" class="weather-card">
            <h2 id="cityName">City Name</h2>
            <div class="temp-box">
                <span id="temperature">--</span>°C
            </div>
            <p id="condition">--</p>
            <div class="details">
                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <p id="humidity">--%</p>
                </div>
                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <p id="wind">-- km/h</p>
                </div>
            </div>
        </div>
        <p id="errorMsg" class="error"></p>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            const result = document.getElementById('weatherResult');
            const errorMsg = document.getElementById('errorMsg');

            if (!city) {
                errorMsg.textContent = "Please enter a city name!";
                result.style.display = 'none';
                return;
            }

            errorMsg.textContent = "Loading...";

            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`;
                const geoResponse = await fetch(geoUrl);
                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    errorMsg.textContent = "City not found. Try again.";
                    result.style.display = 'none';
                    return;
                }

                const { latitude, longitude, name, country } = geoData.results[0];

                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`;
                const weatherResponse = await fetch(weatherUrl);
                const weatherData = await weatherResponse.json();

                const current = weatherData.current;

                document.getElementById('cityName').textContent = `${name}, ${country}`;
                document.getElementById('temperature').textContent = Math.round(current.temperature_2m);
                document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
                document.getElementById('wind').textContent = `${current.wind_speed_10m} km/h`;
                document.getElementById('condition').textContent = getWeatherCondition(current.weather_code);

                result.style.display = 'block';
                errorMsg.textContent = '';

            } catch (error) {
                console.error(error);
                errorMsg.textContent = "Something went wrong. Check console (F12) for details.";
                result.style.display = 'none';
            }
        }

        function getWeatherCondition(code) {
            const conditions = {
                0: "Clear sky",
                1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
                45: "Foggy", 48: "Depositing rime fog",
                51: "Light drizzle", 53: "Moderate drizzle", 55: "Dense drizzle",
                61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
                71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow",
                80: "Rain showers", 81: "Moderate showers", 82: "Violent showers",
                95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Heavy thunderstorm"
            };
            return conditions[code] || "Unknown";
        }

        document.getElementById('cityInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') getWeather();
        });
    </script>
</body>
</html>
